name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager_path="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ -z "$android_sdk" || ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$sdkmanager_path" || ! -x "$sdkmanager_path" ]]; then
            echo "Android sdkmanager is unavailable." >&2
            exit 1
          fi
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android verification
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --rerun-tasks lintDebug assembleDebug assembleDebugAndroidTest verifyThirdPartyNotices

      - name: Build unsigned F-Droid Release APK
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew -PfdroidBuild=true assembleRelease --no-configuration-cache

          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -f "$unsigned_apk" ]] || {
            echo "Unsigned F-Droid APK was not produced at $unsigned_apk." >&2
            exit 1
          }
          [[ -n "$android_sdk" ]] || {
            echo "ANDROID_SDK_ROOT and ANDROID_HOME are both unavailable." >&2
            exit 1
          }
          aapt2="$android_sdk/build-tools/36.0.0/aapt2"
          apksigner="$android_sdk/build-tools/36.0.0/apksigner"
          [[ -x "$aapt2" ]] || { echo "aapt2 36.0.0 is unavailable." >&2; exit 1; }
          [[ -x "$apksigner" ]] || { echo "apksigner 36.0.0 is unavailable." >&2; exit 1; }

          "$aapt2" dump badging "$unsigned_apk" >/dev/null
          if "$apksigner" verify "$unsigned_apk" >/dev/null 2>&1; then
            echo "F-Droid build unexpectedly produced a signed APK." >&2
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TokenFlow-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
